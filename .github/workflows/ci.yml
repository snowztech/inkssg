name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Build example - minimal
        run: go run ./cmd/inkssg build ./examples/minimal

      - name: Build example - multi-page
        run: go run ./cmd/inkssg build ./examples/multi-page

      - name: Build example - bio
        run: go run ./cmd/inkssg build ./examples/bio

      - name: Build example - library
        working-directory: examples/library
        run: |
          go mod tidy
          go run main.go
