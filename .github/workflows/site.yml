name: Site

# Builds site/ with inkssg from this repo and publishes it to GitHub Pages,
# served at snowztech.github.io/inkssg.
on:
  push:
    branches: [main]
    paths: [site/**, themes/**, "*.go", cmd/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go run ./cmd/inkssg build site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
