<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2744"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fd"/>
      <stop offset="1" stop-color="#cfd9ee"/>
    </linearGradient>
  </defs>
  <!-- macOS-style tile, same inset as the Farol / OneCorp / Holt icons -->
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="207" height="207" rx="47.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- tentacles -->
  <g fill="none" stroke="url(#body)" stroke-width="15" stroke-linecap="round">
    <path d="M94 138 q-4 22 -20 32"/>
    <path d="M114 148 q-2 24 -12 38"/>
    <path d="M142 148 q2 24 12 38"/>
    <path d="M162 138 q4 22 20 32"/>
  </g>

  <!-- head -->
  <ellipse cx="128" cy="112" rx="54" ry="48" fill="url(#body)"/>

  <!-- face -->
  <circle cx="109" cy="114" r="8" fill="#0b1020"/>
  <circle cx="147" cy="114" r="8" fill="#0b1020"/>
  <circle cx="111.5" cy="111" r="2.6" fill="#ffffff"/>
  <circle cx="149.5" cy="111" r="2.6" fill="#ffffff"/>
  <ellipse cx="96" cy="129" rx="6" ry="4" fill="#f2a7bb" opacity=".7"/>
  <ellipse cx="160" cy="129" rx="6" ry="4" fill="#f2a7bb" opacity=".7"/>
  <path d="M120 130 q8 7 16 0" fill="none" stroke="#0b1020" stroke-width="3.5" stroke-linecap="round"/>

</svg>
